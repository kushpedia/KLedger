version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kililedger_prod}
      POSTGRES_USER: ${POSTGRES_USER:-kililedger_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: kililedger.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change_me_to_long_random_secret_key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,app.kililedger.co.ke}
      POSTGRES_DB: ${POSTGRES_DB:-kililedger_prod}
      POSTGRES_USER: ${POSTGRES_USER:-kililedger_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      - db

volumes:
  postgres_data:
